    decimals: 0
    dataset: bcb_estban
    methodology: estban
    description: Saldo das operações de crédito (verbete 160) das agências do território, posição de dezembro.
    limitations: Só bancos com carteira comercial e caixas econômicas; saldo registrado na agência, não no domicílio do tomador. Município sem agência = ausente.
  - id: credito_emprestimos
    name: Empréstimos e títulos descontados (ESTBAN)
    short_name: Empréstimos
    dimension: financeiro
    unit: brl
    nature: observado
    value_kind: nominal
    stock_flow: estoque
    additive: true
    decimals: 0
    dataset: bcb_estban
    methodology: estban
    description: Verbete 161 — capital de giro, crédito pessoal, cheque especial e desconto de títulos; aproxima o crédito de curto prazo e ao consumo.
  - id: credito_financiamentos
    name: Financiamentos (ESTBAN)
