# Catálogo de indicadores.
# nature: observado (publicado pela fonte) | derivado (fórmula sobre observados) | estimado (método próprio)
# origem: instruções para os pipelines de ingestão (não vão para o banco).
dimensions:
  - {id: demografia, name: Demografia, status: parcial}
  - {id: economia, name: Economia produtiva, status: mvp}
  - {id: trabalho, name: Trabalho e renda, status: parcial}
  - {id: educacao, name: Educação, status: parcial}
  - {id: saude, name: Saúde, status: planejado}
  - {id: habitacao, name: Habitação e infraestrutura, status: parcial}
  - {id: financas_publicas, name: Estado e finanças públicas, status: planejado}
  - {id: territorio, name: Território e meio ambiente, status: planejado}
  - {id: financeiro, name: Sistema monetário e financeiro, status: mvp}
  - {id: patrimonio, name: Patrimônio e riqueza, status: mvp}
  - {id: politica, name: Política e comportamento eleitoral, status: planejado}

defaults:
  levels: [BR, REGIAO, UF, RGINT, RGI, MUN]
  frequency: A

indicators:
  # ---------------- Demografia (suporte às normalizações) ----------------
  - id: populacao
    name: População residente
    dimension: demografia
    unit: pessoas
    nature: observado
    value_kind: quantidade
    stock_flow: estoque
    additive: true
    decimals: 0
    dataset: sidra_6579
    methodology: populacao_composta
    description: População residente segundo censos (2000, 2010, 2022) e estimativas anuais do IBGE.
    limitations: Mistura contagens censitárias e estimativas; há descontinuidades em 2010 e 2022. Sem dados para 1995–1999, 2007 e 2023.
    breaks:
      - {period: "2010", note: "Censo Demográfico 2010 (contagem) — anos vizinhos são estimativas."}
      - {period: "2022", note: "Censo Demográfico 2022 (contagem) — estimativas de 2011–2021 partiam do Censo 2010."}
  - id: area_km2
    name: Área territorial
    dimension: demografia
    unit: km2
    nature: observado
    value_kind: quantidade
    stock_flow: estoque
    additive: true
    dataset: sidra_4714
    methodology: malha_territorial
    description: Área da unidade territorial divulgada com o Censo 2022.
    origem: {tipo: sidra, tabela: "4714", variavel: "6318", periodos: ["2022"]}
  - id: densidade
    name: Densidade demográfica
    dimension: demografia
    unit: hab_km2
    nature: derivado
    value_kind: razao
    formula: "populacao / ultimo(area_km2)"
    dataset: atlas_derivados
    methodology: per_capita
    description: População do ano dividida pela área territorial vigente (2022).
    limitations: Usa a área de 2022 para todos os anos; municípios com alteração de limites têm densidade histórica imprecisa.
  - id: crescimento_pop
    name: Crescimento populacional anual
    dimension: demografia
    unit: pct
    nature: derivado
    value_kind: taxa
    formula: "(populacao / lag(populacao, 1) - 1) * 100"
    dataset: atlas_derivados
    methodology: populacao_composta
    description: Variação percentual da população em relação ao ano anterior.
    limitations: Variações entre ano de estimativa e ano de censo (2010, 2022) refletem também a troca de método; ausente quando o ano anterior não tem dado.

