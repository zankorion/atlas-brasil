    value_kind: nominal
    stock_flow: estoque
    decimals: 0
    formula: "depositos_vista + depositos_poupanca + depositos_prazo"
    dataset: atlas_derivados
    methodology: estban
    description: Depósitos à vista + poupança + a prazo; exclui depósitos interfinanceiros.
    limitations: Só bancos com carteira comercial e caixas econômicas; saldo registrado na agência, não no domicílio do depositante.
