    additive: true
    decimals: 0
    dataset: bcb_estban
    methodology: estban
    description: Soma dos verbetes 163 a 166 (custeio, investimento e comercialização agrícola e pecuária).
    limitations: O detalhamento dos verbetes rurais mudou ao longo do tempo; o Atlas soma os verbetes 163–166 presentes em cada arquivo.
  - id: credito_imobiliario
    name: Financiamentos imobiliários (ESTBAN)
