  # ---------------- Pix (BCB) ----------------
  - id: pix_valor
    name: Pix — valor pago por pessoas e empresas do município
    short_name: Pix — valor pago
    dimension: financeiro
    unit: brl
    nature: observado
    value_kind: nominal
    stock_flow: fluxo
    additive: true
    decimals: 0
    dataset: bcb_pix
    methodology: pix
    description: Soma, nos 12 meses do ano, do valor das transações Pix em que o pagador (pessoa física ou jurídica) está vinculado ao município.
    limitations: O município é o do cadastro do usuário na instituição, não o local da compra. Inclui transferências entre contas da mesma pessoa. Só anos completos (2021 em diante).
  - id: pix_transacoes
    name: Pix — quantidade de transações pagas
    short_name: Pix — transações
    dimension: financeiro
    unit: transacoes
    nature: observado
    value_kind: quantidade
    stock_flow: fluxo
    additive: true
    decimals: 0
    dataset: bcb_pix
    methodology: pix
    description: Número de transações Pix no ano em que o pagador está vinculado ao município.
    limitations: O município é o do cadastro do pagador. Só anos completos (2021 em diante).
  - id: pix_valor_recebido
    name: Pix — valor recebido por pessoas e empresas do município
    short_name: Pix — valor recebido
    dimension: financeiro
    unit: brl
    nature: observado
    value_kind: nominal
    stock_flow: fluxo
    additive: true
    decimals: 0
    dataset: bcb_pix
    methodology: pix
    description: Soma, nos 12 meses do ano, do valor das transações Pix em que o recebedor está vinculado ao município.
    limitations: O município é o do cadastro do recebedor. Empresas com sede em outro município recebem lá, não onde vendem.
  - id: pix_valor_pf
    name: Pix — valor pago por pessoas físicas
    short_name: Pix — valor pago por pessoas físicas
    dimension: financeiro
    unit: brl
    nature: observado
    value_kind: nominal
    stock_flow: fluxo
    additive: true
    decimals: 0
    dataset: bcb_pix
    methodology: pix
    description: Parcela do valor pago por Pix cujos pagadores são pessoas físicas do município.
  - id: pix_usuarios_pf
    name: Pix — pessoas físicas que pagaram com Pix em dezembro
    short_name: Pix — pessoas pagadoras (dez.)
    dimension: financeiro
    unit: pessoas
    nature: observado
    value_kind: quantidade
    stock_flow: estoque
    decimals: 0
    levels: [MUN]
    dataset: bcb_pix
    methodology: pix
    description: Número de pessoas físicas vinculadas ao município que fizeram ao menos um pagamento por Pix em dezembro.
    limitations: Contagem mensal; não é somada entre municípios nem entre meses, pois a mesma pessoa pode constar em mais de um.
  - id: pix_pc
    name: Pix — valor pago por habitante
    short_name: Pix por habitante
    dimension: financeiro
    unit: brl_pc
    nature: derivado
    value_kind: nominal
    stock_flow: fluxo
    formula: "pix_valor / populacao"
    dataset: atlas_derivados
    methodology: pix
  - id: pix_ticket_medio
    name: Pix — valor médio por transação
    short_name: Pix — valor médio
    dimension: financeiro
    unit: brl_transacao
    nature: derivado
    value_kind: nominal
    formula: "pix_valor / pix_transacoes"
    dataset: atlas_derivados
    methodology: pix
  - id: pix_pct_pf
    name: Pix — participação das pessoas físicas no valor pago
    short_name: Pix — % pago por pessoas físicas
    dimension: financeiro
    unit: pct
    nature: derivado
    value_kind: razao
    formula: "part(pix_valor_pf, pix_valor)"
    dataset: atlas_derivados
    methodology: pix
  - id: pix_recebido_pago
    name: Pix — valor recebido em relação ao valor pago
    short_name: Pix — recebido / pago
    dimension: financeiro
    unit: pct
    nature: derivado
    value_kind: razao
    formula: "pct(pix_valor_recebido, pix_valor)"
    dataset: atlas_derivados
    methodology: pix
    description: Acima de 100%, o município recebe por Pix mais do que paga; abaixo, paga mais do que recebe.
    limitations: Reflete também onde as empresas recebedoras têm cadastro (sedes), não só o comércio local.
  - id: pix_usuarios_pct_pop
    name: Pix — pessoas pagadoras em dezembro em relação à população
    short_name: Pix — pagadores / população
    dimension: financeiro
    unit: pct
    nature: derivado
    value_kind: razao
    levels: [MUN]
    formula: "pct(pix_usuarios_pf, populacao)"
    dataset: atlas_derivados
    methodology: pix
    limitations: Pode passar de 100% onde há mais usuários cadastrados no município do que moradores estimados.
  - id: pix_pib
    name: Pix — valor pago em relação ao PIB
    short_name: Pix / PIB
    dimension: financeiro
    unit: pct
    nature: derivado
    value_kind: razao
    formula: "pct(pix_valor, pib_nominal)"
    dataset: atlas_derivados
    methodology: pix
    limitations: Pix mede pagamentos brutos (inclui transferências e a mesma renda circulando várias vezes); PIB mede valor adicionado. A razão indica intensidade de uso, não parcela do PIB.
