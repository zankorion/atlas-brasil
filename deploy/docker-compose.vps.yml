# Publicação em um VPS com proxy reverso já existente (Traefik do Easypanel), usando o banco SQLite pronto.
#
#   cd /opt/atlas && docker compose -f deploy/docker-compose.vps.yml up -d --build
#
# O banco e as malhas ficam em /opt/atlas-data no servidor (atlas.db e geo/), enviados a partir da máquina
# onde as cargas foram feitas. Os contêineres não publicam portas: o proxy os alcança pela rede `easypanel`.
# O site e a API respondem no mesmo endereço (a API em /api), por isso NEXT_PUBLIC_API_URL fica vazio.
services:
  api:
    build: ../backend
    container_name: atlas-api
    restart: unless-stopped
    environment:
      ATLAS_DATABASE_URL: sqlite:////data/atlas.db
      ATLAS_DATA_DIR: /data
      ATLAS_CACHE_MB: "250"
      ATLAS_CORS_ORIGINS: ${ATLAS_PUBLIC_URL:-https://atlas.strenos.com.br}
    volumes:
      - /opt/atlas-data:/data
    mem_limit: 1500m
    memswap_limit: 1500m  # sem swap: se estourar, o contêiner é encerrado e reiniciado em vez de travar
    cpus: 0.8
    networks: [easypanel]

  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: atlas-web
    restart: unless-stopped
    depends_on: [api]
    mem_limit: 512m
    networks: [easypanel]

networks:
  easypanel:
    external: true
